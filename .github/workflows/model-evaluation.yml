name: Model Evaluation (Providence)

# Providence Session 3 - Automated evaluation of candidate models
# Runs on:
#   - PR that touches evaluation code or datasets (gate)
#   - Nightly cron (regression)
#   - Manual workflow_dispatch with a model override
#
# Success criteria == the same thresholds enforced in 09_exception_process.py.
# Artifacts (platform-approval-*.json, usecase-*.json, exception-decision-*.json)
# are uploaded on every run and downloadable from the Actions tab.

on:
  pull_request:
    paths:
      - '0*_*.py'
      - '_*.py'
      - 'datasets/**'
      - 'requirements.txt'
      - '.github/workflows/model-evaluation.yml'
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily (00:00 PT)
  workflow_dispatch:
    inputs:
      candidate_model_a:
        description: 'Candidate model A deployment name'
        required: false
        default: 'gpt-5'
      candidate_model_b:
        description: 'Candidate model B deployment name'
        required: false
        default: 'gpt-5-mini'

permissions:
  id-token: write    # OIDC federated auth to Azure (no secrets on disk)
  contents: read
  pull-requests: write  # for the summary comment

jobs:
  evaluate:
    name: Evaluate candidate models
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write .env for scripts
        env:
          AOAI_ENDPOINT: ${{ secrets.AOAI_ENDPOINT }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_ACCOUNT_NAME: ${{ secrets.FOUNDRY_ACCOUNT_NAME }}
          FOUNDRY_PROJECT_NAME: ${{ secrets.FOUNDRY_PROJECT_NAME }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: eastus2
          MODEL_A: ${{ inputs.candidate_model_a || 'gpt-5' }}
          MODEL_B: ${{ inputs.candidate_model_b || 'gpt-5-mini' }}
        run: |
          cat > .env <<EOF
          AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP=$AZURE_RESOURCE_GROUP
          AZURE_LOCATION=$AZURE_LOCATION
          FOUNDRY_ACCOUNT_NAME=$FOUNDRY_ACCOUNT_NAME
          FOUNDRY_PROJECT_NAME=$FOUNDRY_PROJECT_NAME
          AOAI_ENDPOINT=$AOAI_ENDPOINT
          FOUNDRY_PROJECT_ENDPOINT=$FOUNDRY_PROJECT_ENDPOINT
          API_VERSION=2025-01-01-preview
          CANDIDATE_MODEL_A=$MODEL_A
          CANDIDATE_MODEL_B=$MODEL_B
          JUDGE_MODEL=gpt-4o
          AGENT_MODEL=$MODEL_A
          EXCEPTION_APPROVER_EMAIL=providence-ai-governance@example.com
          EOF

      # Lens 1 - platform approval (safety + quality floor).
      - name: 01 Platform approval
        run: python 01_platform_approval_eval.py

      # Lens 2 - clinical use-case with Providence overlay.
      - name: 02 Clinical use-case
        run: python 02_usecase_clinical_eval.py

      # Lens 2 - non-clinical use-case.
      - name: 03 Non-clinical use-case
        run: python 03_usecase_nonclinical_eval.py

      # Custom evaluators standalone (sanity).
      - name: 07 Custom evaluators
        run: python 07_custom_evaluators.py

      # Adversarial / red-team harness.
      - name: 08 Red-team adversarial
        run: python 08_redteam_adversarial.py

      # Governance decision engine (this is the PR gate).
      - name: 09 Exception process
        id: gate
        run: |
          python 09_exception_process.py
          python - <<'PY'
          import json, sys, pathlib
          denied = []
          for f in pathlib.Path("eval-outputs").glob("exception-decision-*.json"):
              d = json.loads(f.read_text())
              print(f"{d['model']:20s} -> {d['decision']}")
              if d["decision"] == "AUTO_DENIED":
                  denied.append(d["model"])
          if denied:
              print(f"::error::Auto-denied: {', '.join(denied)}")
              sys.exit(1)
          PY

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: providence-eval-outputs
          path: 'eval-outputs/**'
          retention-days: 30

      - name: PR summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'eval-outputs';
            const decisions = fs.readdirSync(dir)
              .filter(f => f.startsWith('exception-decision-'))
              .map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')));
            const rows = decisions.map(d =>
              `| ${d.model} | **${d.decision}** | ${(d.hard_failures||[]).join('<br>') || '-'} |`
            ).join('\n');
            const body = `### Providence Model Evaluation\n\n` +
              `| Model | Decision | Hard failures |\n|---|---|---|\n${rows}\n`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
